imports:
  - git:
      url: https://github.com/ariel-os/ariel-os
      tag: v0.6.0
    dldir: ariel-os

modules:
  - name: nrf-power-optimisation
    env:
      global:
        FEATURES:
          - nrf-power-optimisation

    # boards confirmed to have a LC filter
    context:
      - nrf52840dk
      - seeedstudio-xiao-nrf52840-plus
      - adafruit-feather-nrf52840-express

  - name: nrf-qspi-optimisation
    env:
      global:
        FEATURES:
          - nrf-qspi-optimisation

    # boards with a QSPI flash
    context:
      - seeedstudio-xiao-nrf52840-plus
      - adafruit-feather-nrf52840-express

apps:
  - name: mobile-asset-tracker-advertiser
    selects:
      - ble-peripheral
      - ble-config-static-address
      - ?nrf-power-optimisation
      - ?nrf-qspi-optimisation
    env:
      global:
        executor_stacksize_required:
          - "32768"
