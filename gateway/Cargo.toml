[package]
name = "ble-scan-reporter-demo-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
ariel-os = { path = "build/imports/ariel-os/src/ariel-os", features = [
  "mdns",
  "dns",
  "time",
  "uart",
  "sensors",
  "external-interrupts",
  "i2c",
  "csprng",
] }
ariel-os-boards = { path = "build/imports/ariel-os/src/ariel-os-boards" }
ariel-os-sensor-nrf91-gnss = { path = "build/imports/ariel-os/src/sensors/ariel-os-sensor-nrf91-gnss", features = [
  "defmt",
] }
ariel-os-sensors-gnss-time-ext = { path = "build/imports/ariel-os/src/ariel-os-sensors-gnss-time-ext", features = [
  "defmt",
] }
embassy-futures = { version = "0.1.1" }
heapless = { version = "0.9.2", features = ["serde"] }

const-str = { version = "1.1", features = ["proc"] }

rand_core = "0.6.4"
common-types = { path = "../common-types" }
linkme = { version = "0.3.35" }
embedded-io-async = "=0.6.1"
postcard = { version = "1.1.3", features = ["use-defmt"] }

embassy-sync = { version = "0.7.2" }
embassy-nrf = { version = "0.9.0" }

serde = { version = "1", default-features = false, features = ["derive"] }

coap-handler = { version = "0.2.0", optional = true }
coap-handler-implementations = { version = "=0.6.1", optional = true }
coap-message = { version = "0.3.2", optional = true }
coap-message-utils = { version = "0.3.9", optional = true }
coap-numbers = { version = "0.2.8", optional = true }
coap-request = { version = "0.2.0-alpha.2", optional = true }
coap-request-implementations = { version = "=0.1.0-alpha.4", optional = true }
embedded-nal-coap = { version = "=0.1.0-alpha.5", optional = true }
minicbor = { version = "=2.1.3", optional = true }

serde_json = { version = "1", default-features = false, features = [
  "alloc",
], optional = true }
# A bug in embedded-tls 0.18.0, which reqwless 0.14.0 depends on, makes this
# temporarily needed.
# The `heapless` feature is needed since 0.8.0-rc.2.
der = { version = "0.8", default-features = false, features = [
  "heapless",
], optional = true }
reqwless = { version = "0.14.0", default-features = true, features = [
  "embedded-tls",
  "rsa",
], optional = true }
static_cell = { version = "2.1.1", optional = true }

[features]
default = []
fake-position = []
http-backend = ["dep:der", "dep:reqwless", "dep:serde_json", "ariel-os/tcp"]
coap-backend = [
  "dep:coap-handler",
  "dep:coap-handler-implementations",
  "dep:coap-message",
  "dep:coap-message-utils",
  "dep:coap-numbers",
  "dep:coap-request",
  "dep:coap-request-implementations",
  "dep:embedded-nal-coap",
  "dep:minicbor",
  "ariel-os/udp",
  "common-types/minicbor",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(context, values(any()))',
] }
