imports:
  - git:
      url: https://github.com/nponsard/ariel-os
      # branch: laposte-demo-v0.5.1
      commit: 9f5304ec7de700b113643ce9d695bc8a64f2bf4b
    dldir: ariel-os

apps:
  - name: ble-scan-reporter-demo-gateway
    context:
      - nordic-thingy-91-x-nrf9151
    env:
      global:
        executor_stacksize_required:
          - "131072"
    selects:
      - alloc
      - nrf91-modem
      - ltem-nrf-modem
      - network
      - random
      - ?coap-backend

modules:
  - name: fake-position
    env:
      global:
        FEATURES:
          - fake-position
  - name: http-backend
    conflicts:
      - coap-backend
    env:
      global:
        FEATURES:
          - http-backend
  - name: coap-backend
    conflicts:
      - http-backend
    selects:
      - coap-client
      - coap-server
      - coap-server-config-storage
    env:
      global:
        FEATURES:
          - coap-backend
