imports:
  - git:
      url: https://github.com/nponsard/ariel-os
      # branch: mobile-asset-tracker-v0.6.0
      commit: 634d6371c78938893632715edf018c95f7e3a535
    dldir: ariel-os

apps:
  - name: ble-scan-reporter-demo-gateway
    context:
      - nordic-thingy-91-x-nrf9151
    env:
      global:
        executor_stacksize_required:
          - "131072"
    selects:
      - alloc
      - nrf91-modem
      - ltem-nrf-modem
      - network
      - random
      - ?coap-backend

modules:
  - name: fake-position
    env:
      global:
        FEATURES:
          - fake-position
  - name: http-backend
    conflicts:
      - coap-backend
    env:
      global:
        FEATURES:
          - http-backend
  - name: coap-backend
    conflicts:
      - http-backend
    selects:
      - coap-client
      - coap-server
      - coap-server-config-storage
    env:
      global:
        FEATURES:
          - coap-backend
